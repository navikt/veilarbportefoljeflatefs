name: paoa frontend container dev

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/poao-frontend-container-dev.yaml"
      - ".nais/obo-nais-dev.yaml"
  workflow_dispatch:

concurrency:
  group: pto_frontend_container_dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: deploy gcp dev
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/obo-nais-dev.yaml
