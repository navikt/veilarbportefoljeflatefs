name: Install, build, run Cypress on PR

on: pull_request

jobs:
  cypress-run:
    name: Install, build, run Cypress tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: "https://npm.pkg.github.com"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build application
        run: npm run build:mock
      - name: Run tests
        run: npm run test:ci
      - name: Install Cypress binary
        run: ./node_modules/.bin/cypress install --force
      - name: Cypress run
        uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # ratchet:cypress-io/github-action@v7.4.7
        with:
          install: false
          browser: chrome
          start: npm start
          wait-on: http://localhost:5173
          wait-on-timeout: 90
          record: false
      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
